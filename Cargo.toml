[workspace]
resolver = "2"
members = ["crates/brick-compile", "crates/brick-compile-cli", "crates/brick-compile-wasm"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.133"
brick-compile = { path = "crates/brick-compile" }
miniz_oxide = "0.9.1"
libm = "0.2.16"
num-bigint = { version = "0.4", default-features = false }
rustc-hash = "2.1.3"
quick-xml = "0.42.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
