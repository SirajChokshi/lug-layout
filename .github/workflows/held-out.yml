name: Held-out models

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Generator seed to reproduce a run; leave blank for a fresh one
        required: false
        default: ""

concurrency:
  group: held-out-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  held-out:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: bundle-key
        run: |
          manifest_file=$(node tools/asset-pipeline/src/cli.ts manifest-file)
          input_key=${manifest_file#manifest.}
          echo "input-key=${input_key%.json}" >> "$GITHUB_OUTPUT"
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: part-bundle-${{ steps.bundle-key.outputs.input-key }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-audit
            .cache/ldcad-shadow
            .cache/omr
            .cache/catalog
          key: ldraw-inputs-v2-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json') }}
      - run: pnpm --filter @brr/asset-pipeline restore-ldraw
      - run: pnpm turbo run build --filter=@brr/asset-pipeline
      - uses: actions/cache/save@v4
        if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' && hashFiles('tools/asset-pipeline/dist/bundle/build-key.json') != '' }}
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ steps.bundle-cache.outputs.cache-primary-key }}
      - name: Precompile the pinned library's bake records the import fetches instead of compiling
        run: pnpm --filter @brr/asset-pipeline library-bake --check
      - name: Precompute the pinned library's connector records the import fetches beside the bundle's
        run: pnpm --filter @brr/asset-pipeline library-connectors --check
      - uses: actions/cache@v4
        with:
          path: |
            .cache/held-out/corpus
            .cache/held-out/ldraw
          key: held-out-inputs-${{ hashFiles('tools/e2e/held-out/corpus.json', 'tools/asset-pipeline/ldraw.lock.json') }}
          restore-keys: held-out-inputs-
      - run: pnpm --filter @brr/e2e held-out
        env:
          HELD_OUT_SEED: ${{ inputs.seed }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: held-out-report
          path: .cache/held-out/results/*.md
          retention-days: 90
