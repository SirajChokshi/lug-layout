name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-audit
            .cache/ldcad-shadow
            .cache/omr
          key: ldraw-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json') }}
      - run: pnpm --filter @brr/asset-pipeline restore-ldraw
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm lint:rust
      - run: pnpm format:check
      - run: pnpm check:infra
      - run: pnpm check:rust
      - run: pnpm --filter @brr/asset-pipeline verify-ldraw
      - run: pnpm turbo run typecheck test build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            tools/e2e/playwright-report
            tools/e2e/test-results
          retention-days: 7
