name: CI

on:
  pull_request:
  push:
    branches: [main, "siraj/queue-tail-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      key: ${{ steps.bundle-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bundle-key
        run: |
          input_key=$(node tools/asset-pipeline/src/input-key-cli.ts)
          echo "key=part-bundle-${input_key}-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ steps.bundle-key.outputs.key }}
          lookup-only: true
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: pnpm/action-setup@v4
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/ldraw-inputs
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @brr/asset-pipeline build
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ steps.bundle-key.outputs.key }}
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: part-bundle
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: ./.github/actions/pnpm-install
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ needs.bundle.outputs.key }}
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: part-bundle
          path: tools/asset-pipeline
      - uses: ./.github/actions/ldraw-inputs
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm lint:rust
      - run: pnpm format:check
      - run: pnpm check:infra
      - run: pnpm check:rust
      - run: pnpm test:wasm
      - run: pnpm --filter @brr/asset-pipeline verify-ldraw
      - run: pnpm --filter @brr/asset-pipeline facts --check
      - run: pnpm --filter @brr/asset-pipeline section-vocabulary --check
      - run: pnpm --filter @brr/asset-pipeline shadow-library --check
      - run: pnpm turbo run typecheck build
      - run: cargo build --release -p brick-compile-cli --bin library-connectors
      - run: pnpm turbo run test --concurrency=1

  e2e:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ needs.bundle.outputs.key }}
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: part-bundle
          path: tools/asset-pipeline
      - uses: ./.github/actions/ldraw-inputs
      - run: pnpm --filter @brr/asset-pipeline shadow-library --check
      - run: pnpm turbo run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            tools/e2e/playwright-report
            tools/e2e/test-results
          retention-days: 7

  library-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/pnpm-install
      - id: catalog-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/catalog
          key: library-connector-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json') }}
      - run: pnpm --filter @brr/asset-pipeline ldraw-library shadow-patches --check
      - run: pnpm --filter @brr/asset-pipeline library-connectors --check
      - if: ${{ github.event_name != 'pull_request' && steps.catalog-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/catalog
          key: ${{ steps.catalog-cache.outputs.cache-primary-key }}

  import-bundle-models:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ needs.bundle.outputs.key }}
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: part-bundle
          path: tools/asset-pipeline
      - uses: ./.github/actions/ldraw-inputs
      - run: pnpm turbo run build --filter=@brr/asset-pipeline
      - run: pnpm --filter @brr/import test:bundle-models

  library-bake:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/pnpm-install
      - id: catalog-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/catalog
          key: library-bake-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json') }}
      - name: Recompute every pinned part's bake record and standard GLB and check them against the pin
        run: pnpm --filter @brr/asset-pipeline library-bake --check
      - if: ${{ github.event_name != 'pull_request' && steps.catalog-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/catalog
          key: ${{ steps.catalog-cache.outputs.cache-primary-key }}
      - name: Build the shipped WASM compiler
        run: cargo build --release --target wasm32-wasip1 -p brick-compile-wasm
      - name: Compile every pinned part in the shipped WASM compiler and compare bytes
        run: pnpm --filter @brr/e2e library-bake-parity
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ needs.bundle.outputs.key }}
      - if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: part-bundle
          path: tools/asset-pipeline
      - uses: ./.github/actions/ldraw-inputs
      - name: Drive the editor against the library bake just built
        run: pnpm turbo run e2e:library-bake
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-library-bake-report
          path: |
            tools/e2e/playwright-report
            tools/e2e/test-results
          retention-days: 7

  check:
    if: ${{ always() }}
    needs: [bundle, verify, e2e, library-connectors, import-bundle-models, library-bake]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BUNDLE: ${{ needs.bundle.result }}
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
          LIBRARY_CONNECTORS: ${{ needs.library-connectors.result }}
          IMPORT_BUNDLE_MODELS: ${{ needs.import-bundle-models.result }}
          LIBRARY_BAKE: ${{ needs.library-bake.result }}
        run: |
          echo "bundle: $BUNDLE, verify: $VERIFY, e2e: $E2E, library connectors: $LIBRARY_CONNECTORS, import-bundle-models: $IMPORT_BUNDLE_MODELS, library-bake: $LIBRARY_BAKE"
          test "$BUNDLE" = success && test "$VERIFY" = success && test "$E2E" = success && test "$LIBRARY_CONNECTORS" = success && test "$IMPORT_BUNDLE_MODELS" = success && test "$LIBRARY_BAKE" = success
