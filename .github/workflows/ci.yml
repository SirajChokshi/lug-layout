name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - id: bundle-key
        run: |
          manifest_file=$(node tools/asset-pipeline/src/cli.ts manifest-file)
          input_key=${manifest_file#manifest.}
          echo "input-key=${input_key%.json}" >> "$GITHUB_OUTPUT"
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: part-bundle-${{ steps.bundle-key.outputs.input-key }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-audit
            .cache/ldcad-shadow
            .cache/omr
            .cache/catalog
          key: ldraw-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json') }}
      - run: pnpm --filter @brr/asset-pipeline restore-ldraw
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm lint:rust
      - run: pnpm format:check
      - run: pnpm check:infra
      - run: pnpm check:rust
      - run: pnpm --filter @brr/asset-pipeline verify-ldraw
      - run: pnpm --filter @brr/asset-pipeline facts --check
      - run: pnpm turbo run typecheck build
      - run: pnpm turbo run test --concurrency=1
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.bundle-cache.outputs.cache-hit != 'true' && hashFiles('tools/asset-pipeline/dist/bundle/build-key.json') != '' }}
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: ${{ steps.bundle-cache.outputs.cache-primary-key }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: bundle-key
        run: |
          manifest_file=$(node tools/asset-pipeline/src/cli.ts manifest-file)
          input_key=${manifest_file#manifest.}
          echo "input-key=${input_key%.json}" >> "$GITHUB_OUTPUT"
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: part-bundle-${{ steps.bundle-key.outputs.input-key }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: dtolnay/rust-toolchain@master
        if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-audit
            .cache/ldcad-shadow
            .cache/omr
            .cache/catalog
          key: ldraw-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json') }}
      - run: pnpm --filter @brr/asset-pipeline restore-ldraw
      - run: pnpm turbo run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            tools/e2e/playwright-report
            tools/e2e/test-results
          retention-days: 7

  import-bundle-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: bundle-key
        run: |
          manifest_file=$(node tools/asset-pipeline/src/cli.ts manifest-file)
          input_key=${manifest_file#manifest.}
          echo "input-key=${input_key%.json}" >> "$GITHUB_OUTPUT"
      - id: bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/asset-pipeline/dist/bundle
            tools/asset-pipeline/fixture-bundle
          key: part-bundle-${{ steps.bundle-key.outputs.input-key }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: dtolnay/rust-toolchain@master
        if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.bundle-cache.outputs.cache-hit != 'true' }}
      - uses: actions/cache@v4
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-audit
            .cache/ldcad-shadow
            .cache/omr
            .cache/catalog
          key: ldraw-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json') }}
      - run: pnpm --filter @brr/asset-pipeline restore-ldraw
      - run: pnpm turbo run build --filter=@brr/asset-pipeline
      - run: pnpm --filter @brr/import test:bundle-models

  check:
    if: ${{ always() }}
    needs: [verify, e2e, import-bundle-models]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          VERIFY: ${{ needs.verify.result }}
          E2E: ${{ needs.e2e.result }}
          IMPORT_BUNDLE_MODELS: ${{ needs.import-bundle-models.result }}
        run: |
          echo "verify: $VERIFY, e2e: $E2E, import-bundle-models: $IMPORT_BUNDLE_MODELS"
          test "$VERIFY" = success && test "$E2E" = success && test "$IMPORT_BUNDLE_MODELS" = success
