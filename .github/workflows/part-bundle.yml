name: Part bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: part-bundle-production
  cancel-in-progress: false

jobs:
  status:
    name: Check the public bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      served: ${{ steps.served.outputs.served }}
      pointer_current: ${{ steps.pointer.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Look for this input key's manifests at the public URL
        id: served
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: |
          : "${PART_BUNDLE_BASE_URL:=$(node -p "require('./infra/cloudflare/part-bundles.json').public_base_url")}"
          export PART_BUNDLE_BASE_URL
          node tools/asset-pipeline/src/cli.ts served
      - name: Check whether current/latest.json already names this input key
        id: pointer
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/pointer/cli.ts current

  publish:
    name: Publish part bundle
    needs: status
    if: needs.status.outputs.served != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Check the bucket for the input key
        id: status
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/cli.ts published
      - name: Report missing credentials
        if: steps.status.outputs.configured == 'false'
        run: echo "::warning::Part bundle not published. The production environment has no Cloudflare token; see docs/part-bundle.md."
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        if: steps.status.outputs.published == 'false'
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.status.outputs.published == 'false'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.status.outputs.published == 'false'
        with:
          path: |
            .cache/ldraw
            .cache/ldraw-audit
            .cache/ldcad-shadow
            .cache/ldcad-shadow-bundle
            .cache/omr
            .cache/catalog
            .cache/third-party
          key: ldraw-inputs-v4-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json', 'tools/asset-pipeline/third-party-track.json') }}
          restore-keys: ldraw-inputs-v4-
      - name: Generate the bundle
        if: steps.status.outputs.published == 'false'
        run: pnpm --filter @brr/asset-pipeline build
      - name: Upload new objects, then the manifests
        if: steps.status.outputs.published == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/cli.ts upload
      - name: Summary
        if: steps.status.outputs.configured == 'true'
        env:
          MANIFEST_FILE: ${{ steps.status.outputs.manifest_file }}
          ALREADY_PUBLISHED: ${{ steps.status.outputs.published }}
        run: |
          echo "Part bundle \`$MANIFEST_FILE\`, already published before this run: $ALREADY_PUBLISHED" >> "$GITHUB_STEP_SUMMARY"

  library-bake-status:
    name: Check the public library bake records
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      served: ${{ steps.served.outputs.served }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Look for the pinned index at the public URL
        id: served
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts served
      - name: Look for the pointer naming the pinned index as current
        id: current
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts current

  library-bake-publish:
    name: Publish library bake records and prune old ones
    needs: library-bake-status
    if: ${{ needs.library-bake-status.outputs.served != 'true' || needs.library-bake-status.outputs.current != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Check the bucket for the pinned index
        id: status
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts published
      - name: Report missing credentials
        if: steps.status.outputs.configured == 'false'
        run: echo "::warning::Library bake records not published. The production environment has no Cloudflare token; see docs/part-bundle.md."
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        if: steps.status.outputs.published == 'false'
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.status.outputs.published == 'false'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.status.outputs.published == 'false'
        with:
          path: .cache/catalog
          key: library-bake-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json') }}
      - name: Recompute the records and check them against the pin and the licence gate
        if: steps.status.outputs.published == 'false'
        run: node tools/asset-pipeline/src/library-bake/cli.ts --check
      - name: Upload the records, GLBs and buckets, then the pinned index
        if: steps.status.outputs.published == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts upload
      - name: Verify every served file of the new manifest against its content address
        if: steps.status.outputs.configured == 'true' && (steps.status.outputs.published == 'false' || needs.library-bake-status.outputs.served != 'true' || needs.library-bake-status.outputs.current != 'true')
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts verify-served --all --wait
      - name: Move the pointer to the new manifest, keeping the one it replaces as previous
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts point
      - name: Verify the current and previous manifests, and those the live bundles name, through the served pointer
        if: steps.status.outputs.configured == 'true'
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts verify-pointer --wait
      - name: List what pruning would delete
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts prune --dry-run
      - name: Delete every object that neither the current, the previous nor a live bundle's library-bake index references
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-bake/cli.ts prune
      - name: Summary
        if: steps.status.outputs.configured == 'true'
        env:
          ALREADY_PUBLISHED: ${{ steps.status.outputs.published }}
        run: |
          echo "Library bake records \`$(node -p "require('./tools/asset-pipeline/library-bake.json').index.sha256")\`, already published before this run: $ALREADY_PUBLISHED" >> "$GITHUB_STEP_SUMMARY"

  library-connectors-status:
    name: Check the public library connector records
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      served: ${{ steps.served.outputs.served }}
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Look for the pinned index at the public URL
        id: served
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts served
      - name: Look for the pointer naming the pinned index as current
        id: current
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts current

  library-connectors-publish:
    name: Publish library connector records and prune old ones
    needs: library-connectors-status
    if: ${{ needs.library-connectors-status.outputs.served != 'true' || needs.library-connectors-status.outputs.current != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Check the bucket for the pinned index
        id: status
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts published
      - name: Report missing credentials
        if: steps.status.outputs.configured == 'false'
        run: echo "::warning::Library connector records not published. The production environment has no Cloudflare token; see docs/part-bundle.md."
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        if: steps.status.outputs.published == 'false'
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.status.outputs.published == 'false'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.status.outputs.published == 'false'
        with:
          path: .cache/catalog
          key: library-connector-inputs-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json') }}
      - name: Recompute the records and check them against the pin
        if: steps.status.outputs.published == 'false'
        run: node tools/asset-pipeline/src/library-connectors/cli.ts --check
      - name: Upload the records and package indexes, then the pinned index
        if: steps.status.outputs.published == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts upload
      - name: Verify every served record against its content address
        if: steps.status.outputs.configured == 'true' && (steps.status.outputs.published == 'false' || needs.library-connectors-status.outputs.served != 'true' || needs.library-connectors-status.outputs.current != 'true')
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts verify-served --all --wait
      - name: Move the pointer to the pinned index, keeping the one it replaces as previous
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts point
      - name: Verify the current and previous indexes, and those the live bundles name, through the served pointer
        if: steps.status.outputs.configured == 'true'
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts verify-pointer --wait
      - name: List what pruning would delete
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts prune --dry-run
      - name: Delete every library-connectors object that neither the current, the previous nor a live bundle's library-connectors index references
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library-connectors/cli.ts prune
      - name: Summary
        if: steps.status.outputs.configured == 'true'
        env:
          ALREADY_PUBLISHED: ${{ steps.status.outputs.published }}
        run: |
          echo "Library connector records \`$(node -p "require('./tools/asset-pipeline/library-connectors.json').index.sha256")\`, already published before this run: $ALREADY_PUBLISHED" >> "$GITHUB_STEP_SUMMARY"

  pointer:
    name: Point current/latest.json at this bundle and prune old bundles
    needs: [status, publish, library-bake-publish, library-connectors-publish]
    if: ${{ !cancelled() && needs.status.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && (needs.status.outputs.pointer_current != 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Verify every served file of this bundle's three manifests against its content address
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/pointer/cli.ts verify-served --all --wait
      - name: Move current/latest.json to this bundle, keeping the one it replaces as previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/pointer/cli.ts point
      - name: Verify the current, previous and committed fallback bundles through the served pointer
        env:
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/pointer/cli.ts verify-pointer --wait
      - name: List what pruning would delete
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/pointer/cli.ts prune --dry-run
      - name: Delete every bundle object that neither the current, the previous nor the committed fallback bundle references
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/pointer/cli.ts prune

  starters:
    name: Open every starter in this commit's app from the bundle the served pointer names
    needs: [status, pointer]
    if: ${{ !cancelled() && needs.status.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/web..." --filter "@brr/e2e..."
      - name: Build the app as Vercel builds it, reading the part bundle from R2
        working-directory: apps/web
        env:
          VITE_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: sh vercel-build.sh
      - name: Open every starter on the welcome card
        run: pnpm --filter @brr/e2e exec playwright test tests/starter-worlds.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: starters-served-bundle-report
          path: |
            tools/e2e/playwright-report
            tools/e2e/test-results
          retention-days: 7

  library-status:
    name: Check the public LDraw library
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.needed.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Look for the pinned library's index at the public URL
        id: served
        env:
          LDRAW_LIBRARY_BASE_URL: ${{ vars.LDRAW_LIBRARY_BASE_URL }}
        run: node tools/asset-pipeline/src/library/cli.ts served
      - name: Check whether index/latest.json already names the pinned library
        id: current
        env:
          LDRAW_LIBRARY_BASE_URL: ${{ vars.LDRAW_LIBRARY_BASE_URL }}
        run: node tools/asset-pipeline/src/library/cli.ts current
      - name: Decide whether the library needs publishing or pruning
        id: needed
        env:
          LDRAW_LIBRARY_BASE_URL: ${{ vars.LDRAW_LIBRARY_BASE_URL }}
          EVENT: ${{ github.event_name }}
          SERVED: ${{ steps.served.outputs.served }}
          CURRENT: ${{ steps.current.outputs.current }}
        run: |
          : "${LDRAW_LIBRARY_BASE_URL:=$(node -p "require('./infra/cloudflare/ldraw-library.json').public_base_url ?? ''")}"
          if [ "$EVENT" = workflow_dispatch ]; then
            needed=true
          elif [ -z "$LDRAW_LIBRARY_BASE_URL" ]; then
            needed=false
            echo "::notice::The LDraw library has no public URL, so only Run workflow publishes and prunes it; see docs/ldraw-library.md."
          elif [ "$SERVED" = true ] && [ "$CURRENT" = true ]; then
            needed=false
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  library-publish:
    name: Publish the LDraw library and prune old commits
    needs: [library-status, pointer]
    if: ${{ !cancelled() && needs.library-status.result == 'success' && needs.library-status.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter "@brr/asset-pipeline..."
      - name: Check the bucket for the library index
        id: status
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library/cli.ts published
      - name: Report missing credentials
        if: steps.status.outputs.configured == 'false'
        run: echo "::warning::LDraw library not published. The production environment has no Cloudflare token; see docs/ldraw-library.md."
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.status.outputs.published == 'false'
        with:
          path: .cache/catalog/ldraw-library
          key: ldraw-library-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json') }}
      - name: Check the archive against ldraw.lock.json and the license gate
        if: steps.status.outputs.published == 'false'
        run: node tools/asset-pipeline/src/library/cli.ts check
      - name: Upload the library files, then the index
        if: steps.status.outputs.published == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library/cli.ts upload
      - name: Verify every file the public URL serves for the pinned library against its index
        if: steps.status.outputs.configured == 'true'
        env:
          LDRAW_LIBRARY_BASE_URL: ${{ vars.LDRAW_LIBRARY_BASE_URL }}
        run: |
          : "${LDRAW_LIBRARY_BASE_URL:=$(node -p "require('./infra/cloudflare/ldraw-library.json').public_base_url ?? ''")}"
          if [ -z "$LDRAW_LIBRARY_BASE_URL" ]; then
            echo "::notice::ldraw-library.json has no public_base_url yet and LDRAW_LIBRARY_BASE_URL is unset, so nothing can be checked through a public URL."
            exit 0
          fi
          export LDRAW_LIBRARY_BASE_URL
          node tools/asset-pipeline/src/library/cli.ts verify-served --all
      - name: Move index/latest.json to the pinned library, keeping the one it replaces as previous
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
        run: node tools/asset-pipeline/src/library/cli.ts point
      - name: Verify the current and previous libraries and those the live bundles name through the served pointer
        if: steps.status.outputs.configured == 'true'
        env:
          LDRAW_LIBRARY_BASE_URL: ${{ vars.LDRAW_LIBRARY_BASE_URL }}
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: |
          : "${LDRAW_LIBRARY_BASE_URL:=$(node -p "require('./infra/cloudflare/ldraw-library.json').public_base_url ?? ''")}"
          if [ -z "$LDRAW_LIBRARY_BASE_URL" ]; then
            echo "::notice::ldraw-library.json has no public_base_url yet and LDRAW_LIBRARY_BASE_URL is unset; prune still reads and checks every kept index over the S3 API."
            exit 0
          fi
          export LDRAW_LIBRARY_BASE_URL
          node tools/asset-pipeline/src/library/cli.ts verify-pointer --wait
      - name: List what pruning would delete
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library/cli.ts prune --dry-run
      - name: Delete every library object that neither the current, the previous nor a live bundle's library references
        if: steps.status.outputs.configured == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          PART_BUNDLE_BASE_URL: ${{ vars.PART_BUNDLE_BASE_URL }}
        run: node tools/asset-pipeline/src/library/cli.ts prune
      - name: Summary
        if: steps.status.outputs.configured == 'true'
        env:
          ALREADY_PUBLISHED: ${{ steps.status.outputs.published }}
        run: |
          echo "LDraw library \`$(node -p "require('./tools/asset-pipeline/ldraw.lock.json').source.commit")\`, already published before this run: $ALREADY_PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
