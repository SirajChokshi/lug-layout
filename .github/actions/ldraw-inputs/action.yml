name: LDraw inputs
description: Restores the pinned LDraw inputs from the pin-keyed Actions cache and runs restore-ldraw. Only runs that aren't pull requests save the cache.
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          .cache/ldraw
          .cache/ldraw-audit
          .cache/ldcad-shadow
          .cache/ldcad-shadow-bundle
          .cache/omr
          .cache/catalog
        key: ldraw-inputs-v3-${{ hashFiles('tools/asset-pipeline/ldraw.lock.json', 'tools/asset-pipeline/palette.json') }}
    - shell: bash
      run: pnpm --filter @brr/asset-pipeline restore-ldraw
    - if: ${{ github.event_name != 'pull_request' && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          .cache/ldraw
          .cache/ldraw-audit
          .cache/ldcad-shadow
          .cache/ldcad-shadow-bundle
          .cache/omr
          .cache/catalog
        key: ${{ steps.restore.outputs.cache-primary-key }}
